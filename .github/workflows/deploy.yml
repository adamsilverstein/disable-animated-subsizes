name: Deploy to WordPress.org

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: wordpress-org-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        shell: bash
        run: |
          version=$(sed -n 's/^ \* Version: *//p' disable-animated-subsizes.php)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt)
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "$version" && "$version" == "$stable" ]]
          php -l disable-animated-subsizes.php

      - name: Deploy plugin and directory assets
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: disable-animated-subsizes
